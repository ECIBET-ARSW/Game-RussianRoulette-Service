version: '3.8'

services:
  game-russian-roulette:
    build: .
    image: ecibet-russian-roulette-service:latest
    ports:
      - "8091:8091"
    env_file:
      - .env
    environment:
      # Se mapean explícitamente las variables que la app usa (opcional,
      # env_file ya las inyecta, esto es explícito y claro)
      PORT: ${PORT}
      WALLETS_SERVICE_URL: ${WALLETS_SERVICE_URL}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}


